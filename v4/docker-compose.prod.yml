version: '3.8'

services:
  pwa-glpi:
    image: your-registry.example.com/pwa-glpi:v3-prod
    networks:
      - traefik-public
    secrets:
      - source: pwa_glpi_api_url
        target: glpi_url
      - source: pwa_glpi_app_token
        target: glpi_app_token
      - source: pwa_glpi_user_token
        target: glpi_user_token
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0'
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.pwa-glpi.rule=Host(`your-pwa.example.com`)"
        - "traefik.http.routers.pwa-glpi.entrypoints=web"
        - "traefik.http.services.pwa-glpi.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true

secrets:
  pwa_glpi_api_url:
    external: true
  pwa_glpi_app_token:
    external: true
  pwa_glpi_user_token:
    external: true
