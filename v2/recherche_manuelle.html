<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire GLPI — Recherche manuelle (v2)</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#007bff">
    <style>
        .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 10px; margin: 5px 0; border: none; border-radius: 5px; background: #007bff; color: #fff; cursor: pointer; }
        button:hover { background: #0056b3; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #545b62; }
        button:disabled { background: #adb5bd; cursor: not-allowed; }
        #logs { background: #f8f9fa; border: 1px solid #ccc; padding: 10px; border-radius: 5px; height: 250px; overflow-y: auto; font-family: monospace; font-size: 12px; display: none; }
        .log-error { color: #dc3545; }
        .log-success { color: #28a745; }
        .log-warning { color: #ffc107; }
        .log-info { color: #17a2b8; }
        #test-result { margin-top: 10px; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #333; }
        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .info-box { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px; }
        .field-group { margin-bottom: 10px; }
        .inline-check { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .inline-check input[type="checkbox"] { width: auto; margin: 0; }
    </style>
</head>
<body>
    <header class="app-header" role="banner">
        <a href="index.html" class="app-header__logo" aria-label="Retour à l'accueil">
            <img src="logo_picto.png" alt="Your Company">
            <span class="app-header__logo-text">Solution d'inventaire</span>
        </a>
        <h1 class="app-header__title">Recherche manuelle</h1>
        <a href="https://your-glpi.example.com/" class="app-header__glpi"
           target="_blank" rel="noopener"
           aria-label="Ouvrir le support GLPI (nouvel onglet)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            <span class="app-header__glpi-label">Support GLPI</span>
        </a>
    </header>

    <div class="card">
        <label for="serialNumber">Numéro de série :</label>
        <input type="text" id="serialNumber" value="" placeholder="Entrez le numéro de série">

        <button id="search-btn">Rechercher</button>

        <div id="test-result"></div>
        <div id="result">
            <p>Saisissez un numéro de série puis cliquez sur « Rechercher ».</p>
        </div>

        <!-- Formulaire d'édition, affiché après une recherche réussie -->
        <div id="edit-form" class="hidden">
            <div class="field-group">
                <label for="usersSelect">Utilisateur associé :</label>
                <select id="usersSelect">
                    <option value="0">— Aucun —</option>
                </select>
            </div>

            <div class="field-group">
                <label for="dateBuy">Date d'achat :</label>
                <input type="date" id="dateBuy">
            </div>

            <div class="field-group">
                <label class="inline-check">
                    <input type="checkbox" id="updateInventoryDate" checked>
                    Mettre à jour la date d'inventaire (aujourd'hui)
                </label>
            </div>

            <button id="save-btn">Enregistrer les modifications</button>
            <button id="reset-btn" class="secondary">Nouvelle recherche</button>
        </div>

        <button onclick="window.location.href='index.html'">Mise à jour via QR Code</button>
        <button id="toggle-logs">Afficher / Masquer Logs</button>
        <button id="clear-logs">Effacer les logs</button>
    </div>

    <div class="card">
        <h3>Logs détaillés</h3>
        <div id="logs"></div>
    </div>

    <script src="config.js"></script>
    <script src="app_multi_v2.js"></script>
    <script>
        // Enregistrement du service worker v2
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW v2 non enregistré', err));
        }

        // État courant de l'équipement recherché
        let currentEquip = null;

        const serialInput = document.getElementById("serialNumber");
        const searchBtn   = document.getElementById("search-btn");
        const saveBtn     = document.getElementById("save-btn");
        const resetBtn    = document.getElementById("reset-btn");
        const editForm    = document.getElementById("edit-form");
        const usersSelect = document.getElementById("usersSelect");
        const dateBuyIn   = document.getElementById("dateBuy");
        const invChk      = document.getElementById("updateInventoryDate");
        const out         = document.getElementById("test-result");
        const resEl       = document.getElementById("result");

        function showMessage(type, text) {
            const colors = {
                success: { bg: "#d4edda", fg: "#155724" },
                error:   { bg: "#f8d7da", fg: "#721c24" },
                info:    { bg: "#d1ecf1", fg: "#0c5460" }
            }[type] || { bg: "#eee", fg: "#333" };
            out.innerHTML = `<div style="background:${colors.bg};color:${colors.fg};padding:10px;border-radius:5px;">${text}</div>`;
        }

        function resetForm() {
            currentEquip = null;
            editForm.classList.add("hidden");
            resEl.innerHTML = `<p>Saisissez un numéro de série puis cliquez sur « Rechercher ».</p>`;
            out.innerHTML = "";
            serialInput.value = "";
            serialInput.focus();
        }

        async function populateUsersSelect(selectedId) {
            try {
                const users = await loadGLPIUsers();
                usersSelect.innerHTML = '<option value="0">— Aucun —</option>';
                for (const u of users) {
                    const opt = document.createElement("option");
                    opt.value = u.id;
                    opt.textContent = u.name;
                    if (selectedId && String(u.id) === String(selectedId)) opt.selected = true;
                    usersSelect.appendChild(opt);
                }
                if (!selectedId || selectedId === 0 || selectedId === "0") {
                    usersSelect.value = "0";
                }
                if (users.length === 0) {
                    showMessage("info", "⚠️ Liste utilisateurs vide — vérifier les droits du token sur search/User (voir logs)");
                    document.getElementById("logs").style.display = "block";
                }
            } catch (e) {
                usersSelect.innerHTML =
                    `<option value="" disabled selected>❌ Erreur : ${e.message || e}</option>` +
                    `<option value="0">— Aucun —</option>`;
                showMessage("error", `❌ Liste utilisateurs indisponible : ${e.message || e}`);
                document.getElementById("logs").style.display = "block";
            }
        }

        function renderEquipmentInfo(eq) {
            const inv = eq.infocom || {};
            resEl.innerHTML = `
                <div class="info-box">
                    <p><b>Type :</b> ${eq.type}</p>
                    <p><b>Nom :</b> ${eq.name}</p>
                    <p><b>N° de série :</b> ${eq.serial || "—"}</p>
                    <p><b>Dernier inventaire :</b> ${eq.lastInventory || "Jamais"}</p>
                    <p><b>Date d'achat actuelle :</b> ${inv.buy_date || "Non renseignée"}</p>
                    <p><b>Infocom ID :</b> ${inv.id || "—"}</p>
                </div>
            `;
        }

        document.getElementById("clear-logs").addEventListener("click", () => {
            document.getElementById("logs").innerHTML = "";
            out.innerHTML = "";
        });

        resetBtn.addEventListener("click", resetForm);

        searchBtn.addEventListener("click", async () => {
            const serial = serialInput.value.trim();
            out.innerHTML = "";
            editForm.classList.add("hidden");
            if (!serial) { log("error", "Numéro de série requis"); showMessage("error", "❌ Numéro de série requis"); return; }

            try {
                searchBtn.disabled = true;
                searchBtn.textContent = "Recherche...";

                const eq = await findEquipment(serial);
                if (!eq) {
                    showMessage("error", `❌ Aucun équipement trouvé pour ${serial}`);
                    return;
                }

                currentEquip = eq;
                renderEquipmentInfo(eq);

                // Pré-remplir users_id (depuis l'item complet) et buy_date (depuis l'infocom)
                const itemFull = eq.full && (eq.full.users_id !== undefined ? eq.full : (eq.full[eq.type] || {}));
                const currentUserId = itemFull && itemFull.users_id !== undefined ? itemFull.users_id : 0;
                await populateUsersSelect(currentUserId);

                dateBuyIn.value = toInputDate(eq.infocom && eq.infocom.buy_date);
                invChk.checked = true;

                editForm.classList.remove("hidden");
                showMessage("info", `✅ ${eq.type} trouvé — modifiez les champs puis cliquez sur « Enregistrer »`);
            } catch (e) {
                log("error", "Erreur recherche", e.message || e);
                showMessage("error", `❌ Erreur : ${e.message || e}`);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = "Rechercher";
            }
        });

        saveBtn.addEventListener("click", async () => {
            if (!currentEquip) { showMessage("error", "❌ Aucun équipement sélectionné"); return; }
            out.innerHTML = "";

            try {
                saveBtn.disabled = true;
                saveBtn.textContent = "Enregistrement...";

                const eq = currentEquip;
                const selectedUserId = usersSelect.value;
                const dateBuy = dateBuyIn.value || null; // YYYY-MM-DD ou null
                const doInv = invChk.checked;

                // Valeur précédente users_id (pour éviter un PUT inutile)
                const itemFull = eq.full && (eq.full.users_id !== undefined ? eq.full : (eq.full[eq.type] || {}));
                const prevUserId = itemFull && itemFull.users_id !== undefined ? String(itemFull.users_id) : "0";
                const prevDateBuy = toInputDate(eq.infocom && eq.infocom.buy_date);

                const actions = [];

                // 1) Update users_id sur l'item si changé
                if (String(selectedUserId) !== prevUserId) {
                    const ok = await updateItemUser(eq.type, eq.id, selectedUserId);
                    actions.push({ what: "users_id", ok });
                }

                // 2) Update Infocom (buy_date et/ou inventory_date)
                const infocomId = eq.infocom && eq.infocom.id;
                const dateBuyChanged = (dateBuy || "") !== (prevDateBuy || "");
                if (infocomId && (dateBuyChanged || doInv)) {
                    const payload = {};
                    if (doInv) payload.inventoryDate = formatDateForGLPI();
                    if (dateBuyChanged) payload.dateBuy = dateBuy; // peut être null pour vider
                    const ok = await updateInfocomFields(infocomId, payload);
                    actions.push({ what: "infocom", ok, payload });
                } else if (!infocomId && (dateBuyChanged || doInv)) {
                    log("warning", "Pas d'Infocom — impossible de mettre à jour buy_date / inventory_date");
                    actions.push({ what: "infocom", ok: false, reason: "no_infocom" });
                }

                if (actions.length === 0) {
                    showMessage("info", "ℹ️ Aucune modification à enregistrer");
                } else {
                    const allOk = actions.every(a => a.ok);
                    if (allOk) {
                        showMessage("success", `✅ Modifications enregistrées pour ${eq.name}`);
                    } else {
                        showMessage("error", `⚠️ Enregistrement partiel — consultez les logs`);
                    }
                }

                // Rafraîchir les données affichées
                const refreshed = await findEquipment(eq.serial || serialInput.value.trim());
                if (refreshed) {
                    currentEquip = refreshed;
                    renderEquipmentInfo(refreshed);
                    invChk.checked = false; // on évite de re-cocher "inventaire" par défaut après un save
                    const itemFull2 = refreshed.full && (refreshed.full.users_id !== undefined ? refreshed.full : (refreshed.full[refreshed.type] || {}));
                    const curUid = itemFull2 && itemFull2.users_id !== undefined ? itemFull2.users_id : 0;
                    await populateUsersSelect(curUid);
                    dateBuyIn.value = toInputDate(refreshed.infocom && refreshed.infocom.buy_date);
                }
            } catch (e) {
                log("error", "Erreur enregistrement", e.message || e);
                showMessage("error", `❌ Erreur : ${e.message || e}`);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "Enregistrer les modifications";
            }
        });

        // Submit par Enter dans le champ série
        serialInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); searchBtn.click(); }
        });
    </script>
</body>
</html>
