<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire GLPI</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        h1 { color: #007bff; text-align: center; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-width: 200px; height: auto; }
        button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #video-container { margin: 20px 0; text-align: center; }
        #result { margin: 10px 0; padding: 10px; background: #fff; border-radius: 5px; }
        #logs { background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; padding: 10px; height: 300px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; display: none; }
        .log-error { color: #dc3545; }
        .log-success { color: #28a745; }
        .log-warning { color: #ffc107; }
        .log-info { color: #17a2b8; }
        .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>Inventaire GLPI (Scan QRCode)</h1>
    <div class="logo-container">
        <img src="logo.png" alt="Logo"/>
    </div>

    <div id="video-container">
        <video id="video" width="100%" height="auto" autoplay></video>
    </div>

    <div id="result">
        <p>Scannez un code-barre...</p>
    </div>

    <button id="rescan-button" style="display:none;">Scanner un autre équipement</button>
	<button id="switch-button" style="display:none;">Retourner la caméra</button>
	<button id="reset-permissions">Réinitialiser la caméra</button>
	<button onclick="window.location.href='https://your-pwa.example.com/maj_mnauelle.html'">Mise à jour manuelle</button>
	<button onclick="window.location.href='https://your-glpi.example.com/'">Support GLPI</button>
	<button id="toggle-logs">Afficher / Masquer Logs</button>
    <button id="clear-logs">Effacer les logs</button>

    <div class="card">
        <h3>Logs détaillés</h3>
        <div id="logs"></div>
    </div>

    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <script src="app_multi.js"></script>
    <script>
        document.getElementById("clear-logs").addEventListener("click", () => {
        document.getElementById("logs").innerHTML = "";
        document.getElementById("test-result").innerHTML = "";
        });
    </script>
</body>
</html>
