<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire GLPI - Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { color: #007bff; text-align: center; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-width: 200px; height: auto; }
        #result { margin: 10px 0; padding: 0px; background: #fff; border-radius: 5px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 10px; margin: 5px 0; border: none; border-radius: 5px; background: #007bff; color: #fff; cursor: pointer; }
        button:hover { background: #0056b3; }
        #logs { background: #f8f9fa; border: 1px solid #ccc; padding: 10px; border-radius: 5px; height: 250px; overflow-y: auto; font-family: monospace; font-size: 12px; display: none; }
        #test-result { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Inventaire GLPI (Modification manuelle)</h1>
    <div class="logo-container">
        <img src="logo.png" alt="Logo"/>
    </div>

    <div class="card">
        <label>Numéro de série :</label>
        <input type="text" id="serialNumber" value="">
        <div id="test-result"></div>
        <div id="result">
            <p>Informations sur l'équipement :</p>
        </div>
        <button id="run-test">Mettre à jour la date d'inventaire</button>
		<button onclick="window.location.href='https://your-pwa.example.com/'">Mise à jour via QR Code</button>
		<button onclick="window.location.href='https://your-glpi.example.com/'">Support GLPI</button>
        <button id="toggle-logs">Afficher / Masquer Logs</button>
        <button id="clear-logs">Effacer les logs</button>
    </div>

    <div class="card">
        <h3>Logs détaillés</h3>
        <div id="logs"></div>
    </div>

    <script src="app_multi.js"></script>
    <script>
        const equipmentTypes = ["Computer","Monitor","Peripheral","NetworkEquipment","Phone"];

        document.getElementById("clear-logs").addEventListener("click", () => {
            document.getElementById("logs").innerHTML = "";
            document.getElementById("test-result").innerHTML = "";
        });

        document.getElementById("run-test").addEventListener("click", async () => {
            const serial = document.getElementById("serialNumber").value.trim();
            const out = document.getElementById("test-result");
            out.innerHTML = "";
            if (!serial) { log("error", "Numéro de série requis"); return; }

            if (!sessionToken) await initGLPISession();
            const headers = getAuthHeaders();
            let found = false;

            for (const t of equipmentTypes) {
                const ok = await searchAndUpdate(serial, t, headers);
                if (ok) { found = true; break; }
            }
            if (found) {
                out.innerHTML = `<div style="background:#d4edda;color:#155724;padding:10px;border-radius:5px;">
                    ✅ Inventaire mis à jour pour ${serial}
                </div>`;
            } else {
                out.innerHTML = `<div style="background:#f8d7da;color:#721c24;padding:10px;border-radius:5px;">
                    ❌ Aucun équipement trouvé pour ${serial}
                </div>`;
            }
        });
    </script>
</body>
</html>
