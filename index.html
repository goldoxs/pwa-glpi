<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire GLPI — v2</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo_picto.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#007bff">
    <style>
        button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px;
                 background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #logs { background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; padding: 10px; height: 300px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; display: none; }
        .log-error { color: #dc3545; }
        .log-success { color: #28a745; }
        .log-warning { color: #ffc107; }
        .log-info { color: #17a2b8; }
        .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <header class="app-header" role="banner">
        <a href="index.html" class="app-header__logo" aria-label="Retour à l'accueil">
            <img src="logo_picto.png" alt="Your Company">
            <span class="app-header__logo-text">Solution d'inventaire</span>
        </a>
        <h1 class="app-header__title">Scan QR Code</h1>
        <a href="https://your-glpi.example.com/" class="app-header__glpi"
           target="_blank" rel="noopener"
           aria-label="Ouvrir le support GLPI (nouvel onglet)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            <span class="app-header__glpi-label">Support GLPI</span>
        </a>
    </header>

    <div id="video-container">
        <video id="video" width="100%" height="auto" autoplay></video>
    </div>

    <div id="result">
        <p>Scannez un code-barre...</p>
    </div>

    <button id="rescan-button" style="display:none;">Scanner un autre équipement</button>
    <button id="switch-button" style="display:none;">Retourner la caméra</button>
    <button id="reset-permissions">Réinitialiser la caméra</button>
    <button onclick="window.location.href='recherche_manuelle.html'">Mise à jour manuelle</button>
    <button id="toggle-logs">Afficher / Masquer Logs</button>
    <button id="clear-logs">Effacer les logs</button>

    <div class="card">
        <h3>Logs détaillés</h3>
        <div id="logs"></div>
    </div>

    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <script src="config.js"></script>
    <script src="app_multi_v2.js"></script>
    <script>
        // Enregistrement du service worker v2
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW v2 non enregistré', err));
        }
        document.getElementById("clear-logs").addEventListener("click", () => {
            document.getElementById("logs").innerHTML = "";
            const t = document.getElementById("test-result");
            if (t) t.innerHTML = "";
        });
    </script>
</body>
</html>
